# Easel's Xcode project (ADR-0001). Edit this file, not Easel.xcodeproj: `task generate`
# rewrites the project from it, and the project is not committed. MARKETING_VERSION comes
# from VERSION through the environment.
name: Easel

options:
  bundleIdPrefix: com.datoos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 mode for now; tighten to 6 / complete once the app has settled (see AGENTS.md).
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_LANGUAGE: en-GB
    DEVELOPMENT_TEAM: QKAYS6D525
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Easel:
    type: application
    platform: iOS
    scheme:
      testTargets: [EaselTests]
    sources:
      - path: App
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Easel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen: {}
        # Keeps the AirPlay stream going when the iPad locks.
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.easel
        PRODUCT_NAME: Easel
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  EaselTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EaselTests
    dependencies:
      - target: Easel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.easel.tests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
